<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>掃描 QRCode</title>
  <style>
    body {
      background: #000;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    h2 {
      margin-top: 40px;
      font-size: 24px;
    }
  </style>
</head>
<body>

<h2>掃描中…</h2>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  async function start() {
    await liff.init({ liffId: "2009029194-tbi6gX1Y" });

    if (!liff.isInClient()) {
      alert("請在 LINE 中開啟此頁面");
      return;
    }

    while (true) {
      try {
        // 直接啟動掃描器
        const result = await liff.scanCodeV2();
        const code = result.value;

        // 傳訊息給 LINE Bot
        await liff.sendMessages([
          { type: "text", text: code }
        ]);

        // 掃成功 → 自動關閉 LIFF
        liff.closeWindow();
        return;

      } catch (err) {
        // 掃描失敗（使用者取消 / 沒掃到）
        // 不關閉、不跳錯，繼續等待下一次掃描
        // iPhone 的 scanCodeV2() 會在取消時丟錯誤
        // 我們只要重新進入下一輪 while(true) 即可
      }
    }
  }

  start();
</script>

</body>
</html>
