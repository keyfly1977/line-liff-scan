<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>掃描 QRCode</title>
  <style>
    body {
      background: #000;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    #btn {
      margin-top: 200px;
      padding: 20px 40px;
      background: #00b900;
      color: #fff;
      font-size: 22px;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>
<body>

<h2>掃描 QRCode</h2>
<button id="btn">開始掃描</button>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  async function start() {
    await liff.init({ liffId: "2009029194-tbi6gX1Y" });

    if (!liff.isInClient()) {
      alert("請在 LINE 中開啟此頁面");
      return;
    }

    document.getElementById("btn").onclick = async () => {
      try {
        const result = await liff.scanCodeV2();
        const code = result.value;

        await liff.sendMessages([
          { type: "text", text: code }
        ]);

        liff.closeWindow();
      } catch (err) {
        alert("掃描失敗：" + err);
      }
    };
  }

  start();
</script>

</body>
</html>
