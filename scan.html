<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>掃描 QRCode</title>
  <style>
    body {
      background: #000;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    h2 {
      margin-top: 40px;
      font-size: 24px;
    }
  </style>
</head>
<body>

<h2>掃描中…</h2>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  async function start() {
    await liff.init({ liffId: "2009029194-tbi6gX1Y" });

    if (!liff.isInClient()) {
      alert("請在 LINE 中開啟此頁面");
      return;
    }

    try {
      // 直接啟動掃描器（無需按按鈕）
      const result = await liff.scanCodeV2();
      const code = result.value;

      await liff.sendMessages([
        { type: "text", text: code }
      ]);

      liff.closeWindow();
    } catch (err) {
      alert("掃描失敗：" + err);
    }
  }

  start();
</script>

</body>
</html>
